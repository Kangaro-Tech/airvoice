version: "3.9"

services:
  # ── Nginx Reverse Proxy (SSL + Domain routing) ─────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: airvoice_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api
      - web-admin
    networks:
      - airvoice_net

  # ── Certbot (SSL Certificates) ─────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: airvoice_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - airvoice_net

  # ── API (Fastify Backend) ──────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: airvoice_api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      API_HOST: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - airvoice_net

  # ── Web Admin (React Frontend) ─────────────────────────────────
  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY}
        VITE_GOOGLE_TRANSLATE_API_KEY: ${VITE_GOOGLE_TRANSLATE_API_KEY}
    container_name: airvoice_web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - airvoice_net

networks:
  airvoice_net:
    driver: bridge

volumes:
  certbot_www:
  certbot_certs:
